[workspace]
resolver = "3"
members = ["crates/flux-core", "crates/fluxd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/Scafo745/FluxOs"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
