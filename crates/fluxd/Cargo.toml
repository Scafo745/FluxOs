[package]
name = "fluxd"
description = "FluxOS system daemon: policy enforcement, generations, applier, health checks and audit log"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "fluxd"
path = "src/main.rs"

[dependencies]
flux-core = { path = "../flux-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs", "process", "sync", "time", "net", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
uuid = { version = "1", features = ["v7"] }
getrandom = "0.3"
ed25519-dalek = "2"
base64 = "0.22"
subtle = "2"
